<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake</title>

  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #222;
      color: white;
    }

    #score {
      font-size: 20px;
      margin-top: 10px;
    }

    #gameBoard {
      position: relative;
      width: 400px;
      height: 400px;
      background-color: black;
      border: 2px solid white;
      margin-top: 10px;
    }

    .snakePart {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: limegreen;
    }

    #food {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: red;
      border-radius: 50%;
    }

    #startBtn {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h1>Snake</h1>

  <p id="score">Score: 0</p>

  <button id="startBtn" onclick="startGame()">Start</button>

  <div id="gameBoard"></div>

  <script>
    let gridSize = 20;
    let gridCount = 20;

    let snake = [];
    let dirX = 1;
    let dirY = 0;
    let foodX = 5;
    let foodY = 5;
    let score = 0;
    let timer = null;

    let gameBoard = document.getElementById("gameBoard");
    let scoreText = document.getElementById("score");

    function startGame() {
      snake = [];
      snake.push({ x: 10, y: 10 });
      snake.push({ x: 9, y: 10 });
      snake.push({ x: 8, y: 10 });

      dirX = 1;
      dirY = 0;
      score = 0;
      scoreText.innerHTML = "Score: " + score;

      generateFood();
      draw();

      clearInterval(timer);
      timer = setInterval(gameStep, 150);
    }

    function gameStep() {
      let head = snake[0];
      let newHeadX = head.x + dirX;
      let newHeadY = head.y + dirY;

      if (newHeadX < 0 || newHeadX >= gridCount || newHeadY < 0 || newHeadY >= gridCount) {
        clearInterval(timer);
        alert("Game over! Your score is " + score);
        return;
      }

      let hitSelf = false;
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === newHeadX && snake[i].y === newHeadY) {
          hitSelf = true;
        }
      }
      if (hitSelf) {
        clearInterval(timer);
        alert("Game over! Your score is " + score);
        return;
      }

      snake.unshift({ x: newHeadX, y: newHeadY });

      if (newHeadX === foodX && newHeadY === foodY) {
        score = score + 1;
        scoreText.innerHTML = "Score: " + score;
        generateFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function generateFood() {
      foodX = Math.floor(Math.random() * gridCount);
      foodY = Math.floor(Math.random() * gridCount);
    }

    function draw() {
      gameBoard.innerHTML = "";

      for (let i = 0; i < snake.length; i++) {
        let part = document.createElement("div");
        part.className = "snakePart";
        part.style.left = (snake[i].x * gridSize) + "px";
        part.style.top = (snake[i].y * gridSize) + "px";
        gameBoard.appendChild(part);
      }

      let foodDiv = document.createElement("div");
      foodDiv.id = "food";
      foodDiv.style.left = (foodX * gridSize) + "px";
      foodDiv.style.top = (foodY * gridSize) + "px";
      gameBoard.appendChild(foodDiv);
    }

    document.onkeydown = function (event) {
      if (event.key === "ArrowUp" && dirY === 0) {
        dirX = 0;
        dirY = -1;
      }
      if (event.key === "ArrowDown" && dirY === 0) {
        dirX = 0;
        dirY = 1;
      }
      if (event.key === "ArrowLeft" && dirX === 0) {
        dirX = -1;
        dirY = 0;
      }
      if (event.key === "ArrowRight" && dirX === 0) {
        dirX = 1;
        dirY = 0;
      }
    };
  </script>

</body>
</html>
