<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <link rel="stylesheet" href="sweeper.css">
    <style>
        :root {
            --cell-size: 30px;
            --bg-color: #0b0c10;
            --board-bg: #000000;
            --cell-hidden: #000000;
            --cell-revealed: #202020;
            --border-light: #45f3ff;
            --border-dark: rgb(0, 161, 161);
        }

        body {
            background-color: #0b0c10;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .game-container {
            text-align: center;
            background: #1f2833;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(102, 252, 241, 0.2);
            border: 3px solid #66fcf1;
        }

        .status-bar {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(10, var(--cell-size));
            grid-template-rows: repeat(10, var(--cell-size));
            gap: 2px;
            background-color: var(--board-bg);
            padding: 5px;
            border: 4px solid #45f3ff;
            border-radius: 4px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
            user-select: none;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: var(--cell-hidden);
            border: 2px outset var(--border-light);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            box-sizing: border-box;
        }

        .cell:active {
            border: 1px solid var(--border-dark);
        }

        .cell.revealed {
            background-color: var(--cell-revealed);
            border: 1px solid #66fcf1;
        }

        .cell.mine {
            background-color: #ff4d4d;
        }

        .cell.flagged {
            color: red;
        }

        /* Number Colors */
        .cell[data-number="1"] { color: #66fcf1; }
        .cell[data-number="2"] { color: #45f3ff; }
        .cell[data-number="3"] { color: #ff4d4d; }
        .cell[data-number="4"] { color: #c5c6c7; }
        .cell[data-number="5"] { color: #66fcf1; }
        .cell[data-number="6"] { color: #45f3ff; }
        .cell[data-number="7"] { color: #ffffff; }
        .cell[data-number="8"] { color: #c5c6c7; }

        #reset-btn {
            background-color: #0b0c10;
            border-radius: 100px;
            border: 2px solid #45f3ff;
            padding: 5px 15px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(69, 243, 255, 0.1);
        }

        #op {
            color: #66fcf1;
            text-shadow: 0 0 10px #66fcf1;
            margin: 0;
            font-size: 14px;
        }

        .mine {
            color: #66fcf1;
            text-shadow: 0 0 10px #66fcf1;
            margin-bottom: 5px;
        }

        #mines-count {
            color: #c5c6c7;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.3);
        }

        #game-status {
            text-shadow: 0 0 10px #66fcf1;
            color: #66fcf1;
        }
    </style>
</head>

<body>
    <div class="game-container">
        <h1 class="mine">Minesweeper</h1>
        <div class="status-bar">
            <div id="mines-count">Mines: 10</div>
            <button id="reset-btn">
                <p id="op">New Game</p>
            </button>
            <div id="game-status"></div>
        </div>
        <div id="board"></div>
    </div>
    <script>
        const boardElement = document.getElementById('board');
        const minesCountElement = document.getElementById('mines-count');
        const statusElement = document.getElementById('game-status');
        const resetBtn = document.getElementById('reset-btn');

        const ROWS = 10;
        const COLS = 10;
        const MINES = 10;

        let grid = [];
        let gameOver = false;
        let flags = 0;
        let revealedCount = 0;

        // Initialize game
        function initGame() {
            grid = [];
            gameOver = false;
            flags = 0;
            revealedCount = 0;
            statusElement.textContent = '';
            minesCountElement.textContent = `Mines: ${MINES}`;
            boardElement.innerHTML = '';

            // Create grid
            for (let r = 0; r < ROWS; r++) {
                const row = [];
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    cell.addEventListener('click', () => revealCell(r, c));
                    cell.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        flagCell(r, c);
                    });

                    boardElement.appendChild(cell);
                    row.push({
                        element: cell,
                        isMine: false,
                        revealed: false,
                        flagged: false,
                        neighborMines: 0
                    });
                }
                grid.push(row);
            }

            placeMines();
            calculateNeighbors();
        }

        function placeMines() {
            let minesPlaced = 0;
            while (minesPlaced < MINES) {
                const r = Math.floor(Math.random() * ROWS);
                const c = Math.floor(Math.random() * COLS);
                if (!grid[r][c].isMine) {
                    grid[r][c].isMine = true;
                    minesPlaced++;
                }
            }
        }

        function calculateNeighbors() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c].isMine) continue;
                    let count = 0;
                    for (let i = -1; i <= 1; i++) {
                        for (let j = -1; j <= 1; j++) {
                            const nr = r + i;
                            const nc = c + j;
                            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc].isMine) {
                                count++;
                            }
                        }
                    }
                    grid[r][c].neighborMines = count;
                }
            }
        }

        function revealCell(r, c) {
            if (gameOver || grid[r][c].revealed || grid[r][c].flagged) return;

            const cell = grid[r][c];
            cell.revealed = true;
            cell.element.classList.add('revealed');
            revealedCount++;

            if (cell.isMine) {
                cell.element.classList.add('mine');
                cell.element.textContent = '💣';
                gameOver = true;
                statusElement.textContent = 'Game Over!';
                revealAllMines();
                return;
            }

            if (cell.neighborMines > 0) {
                cell.element.textContent = cell.neighborMines;
                cell.element.dataset.number = cell.neighborMines;
            } else {
                // Flood fill
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        const nr = r + i;
                        const nc = c + j;
                        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                            revealCell(nr, nc);
                        }
                    }
                }
            }

            checkWin();
        }

        function flagCell(r, c) {
            if (gameOver || grid[r][c].revealed) return;

            const cell = grid[r][c];
            if (cell.flagged) {
                cell.flagged = false;
                cell.element.classList.remove('flagged');
                cell.element.textContent = '';
                flags--;
            } else {
                cell.flagged = true;
                cell.element.classList.add('flagged');
                cell.element.textContent = '🚩';
                flags++;
            }
            minesCountElement.textContent = `Mines: ${MINES - flags}`;
            checkWin();
        }

        function revealAllMines() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c].isMine) {
                        grid[r][c].element.classList.add('revealed', 'mine');
                        grid[r][c].element.textContent = '💣';
                    }
                }
            }
        }

        function checkWin() {
            const totalCells = ROWS * COLS;
            const safeCells = totalCells - MINES;

            if (revealedCount === safeCells) {
                gameOver = true;
                statusElement.textContent = 'You Win! 🎉';
                statusElement.style.color = '#66fcf1';
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (grid[r][c].isMine && !grid[r][c].flagged) {
                            grid[r][c].element.classList.add('flagged');
                            grid[r][c].element.textContent = '🚩';
                        }
                    }
                }
                minesCountElement.textContent = 'Mines: 0';
            }
        }

        resetBtn.addEventListener('click', initGame);

        // Start game
        initGame();
    </script>
</body>

</html>
