<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Launcher</title>
    <style>
        body { 
            background-color: #0b0c10; 
            color: #ecf0f1; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding-top: 30px; 
            margin: 0; 
        } 
        h1 { 
            color: #66fcf1; 
            text-shadow: 0 0 10px #66fcf1; 
            margin-bottom: 5px; 
        } 
        p { 
            color: #c5c6c7; 
            font-size: 14px; 
        } 
        #hra-vse { 
            display: inline-flex; 
            background-color: #1f2833; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 0 25px rgba(102, 252, 241, 0.2); 
            gap: 20px; 
            margin-top: 10px; 
        } 
        canvas { 
            background-color: #000000; 
            border: 4px solid #45f3ff; 
            border-radius: 4px; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9); 
        } 
        #panel { 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-start; 
            width: 180px; 
            text-align: left; 
        } 
        .sekce { 
            border: 1px solid #45f3ff; 
            border-radius: 5px; 
            padding: 12px; 
            margin-bottom: 15px; 
            background-color: #0b0c10; 
            box-shadow: 0 0 10px rgba(69, 243, 255, 0.1); 
        } 
        .sekce strong { 
            color: #66fcf1; 
            display: block; 
            margin-bottom: 5px; 
            font-size: 11px; 
            letter-spacing: 1px; 
        } 
        .skore-kontejner { 
            display: flex; 
            justify-content: space-between; 
            font-size: 24px; 
            font-weight: bold; 
            color: #fff; 
        } 
        .hrac-label { 
            font-size: 12px; 
            color: #66fcf1; 
        }

        /* Menu styling adjusted to match the dark neon theme */
        .menu { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 15px; 
            margin-top: 30px; 
        } 
        .btn { 
            background-color: #1f2833; 
            color: #66fcf1; 
            padding: 12px 20px; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 16px; 
            border-radius: 5px; 
            width: 220px; 
            display: inline-block; 
            text-align: center; 
            border: 1px solid #45f3ff;
            box-shadow: 0 0 10px rgba(69, 243, 255, 0.1);
            transition: background 0.2s, box-shadow 0.2s; 
        } 
        .btn:hover { 
            background-color: #45f3ff; 
            color: #0b0c10;
            box-shadow: 0 0 15px rgba(69, 243, 255, 0.4);
        } 
    </style>
</head>
<body>
    <h1>GAME LAUNCHER</h1>
    <p>Vyberte si hru:</p>
    <div class="menu"> 
        <a href="random.html" target="_blank" class="btn">🐍 Snake</a> 
        <a href="pong.html" target="_blank" class="btn">🏓 Ping Pong</a> 
        <a href="sweeper.html" target="_blank" class="btn">💣 Minesweeper</a> 
        <a href="tetris.html" target="_blank" class="btn">🧱 Tetris</a> 
    </div>
</body>
</html>
