<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Game Launcher</title>
    <style>
        body {
            background-color: #2c3e50;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        h1 {
            margin-bottom: 30px;
        }
        .menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .btn {
            background-color: #1abc9c;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 5px;
            width: 220px;
            display: inline-block;
            text-align: center;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #16a085;
        }
    </style>
</head>
<body>

    <h1>VYBER SI HRU</h1>
    
    <div class="menu">
        <a href="https://www.google.com/search?q=play+snake+game" target="_blank" class="btn">🐍 Snake</a>
        <a href="https://www.google.com/search?q=play+pong+game" target="_blank" class="btn">🏓 Ping Pong</a>
        <a href="https://minesweeperonline.com/" target="_blank" class="btn">💣 Minesweeper</a>
        <a href="https://tetris.com/play-tetris" target="_blank" class="btn">🧱 Tetris</a>
    </div>

</body>
</html>
