<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snake with CBF Logic</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #222;
      color: white;
      font-family: sans-serif;
    }
    #score { font-size: 20px; margin-top: 10px; }
    #gameBoard {
      position: relative;
      width: 400px;
      height: 400px;
      background-color: black;
      border: 2px solid white;
      margin-top: 10px;
      overflow: hidden;
    }
    .snakePart {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: limegreen;
      box-sizing: border-box;
      border: 1px solid #004d00;
    }
    #food {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: red;
      border-radius: 50%;
    }
    #startBtn {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    .info { font-size: 12px; color: #aaa; margin-top: 5px; }
  </style>
</head>
<body>

  <h1>Snake (CBF Edition)</h1>
  <p id="score">Score: 0</p>
  <button id="startBtn">Start Game</button>
  <div class="info">Inputs are queued for precision (Click Between Frames style)</div>
  <div id="gameBoard"></div>

  <script>
    // --- Configuration ---
    const gridSize = 20;
    const gridCount = 20;
    const GAME_SPEED_MS = 1000 / 15; // 15 Moves per second (Fixed Timestep)

    // --- State ---
    let snake = [];
    let foodX = 5;
    let foodY = 5;
    let score = 0;
    let isRunning = false;
    
    // Direction Vector
    let dirX = 1;
    let dirY = 0;
    
    // CBF Input Queue: Stores future moves to process one per tick
    let inputQueue = []; 

    // Timing variables for the game loop
    let lastTime = 0;
    let accumulator = 0;
    let animationFrameId = null;

    // --- DOM Elements ---
    const gameBoard = document.getElementById("gameBoard");
    const scoreText = document.getElementById("score");
    const startBtn = document.getElementById("startBtn");

    // --- Event Listeners ---
    startBtn.addEventListener("click", startGame);

    document.addEventListener("keydown", (event) => {
      if (!isRunning) return;

      const key = event.key;
      
      // Get the LAST queued direction, or current direction if queue is empty
      const lastMove = inputQueue.length > 0 
        ? inputQueue[inputQueue.length - 1] 
        : { x: dirX, y: dirY };

      let newDir = null;

      // Prevent reversing directly
      if (key === "ArrowUp" && lastMove.y === 0) newDir = { x: 0, y: -1 };
      if (key === "ArrowDown" && lastMove.y === 0) newDir = { x: 0, y: 1 };
      if (key === "ArrowLeft" && lastMove.x === 0) newDir = { x: -1, y: 0 };
      if (key === "ArrowRight" && lastMove.x === 0) newDir = { x: 1, y: 0 };

      // Add to queue if valid (limit queue size to prevent laggy feel)
      if (newDir && inputQueue.length < 3) {
        inputQueue.push(newDir);
      }
    });

    function startGame() {
      // Reset State
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dirX = 1;
      dirY = 0;
      inputQueue = [];
      score = 0;
      scoreText.innerHTML = "Score: " + score;
      isRunning = true;
      
      generateFood();
      draw();

      // Start Loop
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      lastTime = performance.now();
      accumulator = 0;
      gameLoop(lastTime);
      
      startBtn.textContent = "Restart";
    }

    function gameLoop(currentTime) {
      if (!isRunning) return;

      animationFrameId = requestAnimationFrame(gameLoop);

      const deltaTime = currentTime - lastTime;
      lastTime = currentTime;
      accumulator += deltaTime;

      // Update logic in fixed time steps (CBF Precision)
      while (accumulator >= GAME_SPEED_MS) {
        update();
        accumulator -= GAME_SPEED_MS;
      }

      draw();
    }

    function update() {
      // Process the next input from the queue if available
      if (inputQueue.length > 0) {
        const nextDir = inputQueue.shift();
        dirX = nextDir.x;
        dirY = nextDir.y;
      }

      const head = snake[0];
      const newHeadX = head.x + dirX;
      const newHeadY = head.y + dirY;

      // Wall Collision
      if (newHeadX < 0 || newHeadX >= gridCount || newHeadY < 0 || newHeadY >= gridCount) {
        gameOver();
        return;
      }

      // Self Collision
      // We check against all parts except the very last one (which will move away)
      // unless we just ate food, but for simplicity, check all.
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === newHeadX && snake[i].y === newHeadY) {
          gameOver();
          return;
        }
      }

      // Move Snake
      snake.unshift({ x: newHeadX, y: newHeadY });

      // Eat Food
      if (newHeadX === foodX && newHeadY === foodY) {
        score++;
        scoreText.innerHTML = "Score: " + score;
        generateFood();
      } else {
        snake.pop();
      }
    }

    function gameOver() {
      isRunning = false;
      alert("Game Over! Score: " + score);
      startBtn.textContent = "Start";
    }

    function generateFood() {
      let valid = false;
      while (!valid) {
        foodX = Math.floor(Math.random() * gridCount);
        foodY = Math.floor(Math.random() * gridCount);
        
        // Ensure food doesn't spawn on snake
        valid = !snake.some(part => part.x === foodX && part.y === foodY);
      }
    }

    function draw() {
      gameBoard.innerHTML = "";

      // Draw Snake
      snake.forEach(part => {
        const partDiv = document.createElement("div");
        partDiv.className = "snakePart";
        partDiv.style.left = (part.x * gridSize) + "px";
        partDiv.style.top = (part.y * gridSize) + "px";
        gameBoard.appendChild(partDiv);
      });

      // Draw Food
      const foodDiv = document.createElement("div");
      foodDiv.id = "food";
      foodDiv.style.left = (foodX * gridSize) + "px";
      foodDiv.style.top = (foodY * gridSize) + "px";
      gameBoard.appendChild(foodDiv);
    }
  </script>
</body>
</html>
