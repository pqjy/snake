<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Snake - Šablona</title>

  <style>
    /* Vycentrování celého obsahu na střed obrazovky */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #222;
      color: white;
      font-family: sans-serif;
    }

    /* Vzhled textu pro skóre */
    #score {
      font-size: 20px;
      margin-top: 10px;
    }

    /* Hrací plocha - černý čtverec s bílým okrajem */
    #gameBoard {
      position: relative;
      width: 400px;
      height: 400px;
      background-color: black;
      border: 2px solid white;
      margin-top: 10px;
    }

    /* Vzhled jednoho článku těla hada */
    .snakePart {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: limegreen;
    }

    /* Vzhled jídla (červený puntík) */
    #food {
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: red;
      border-radius: 50%;
    }

    /* Tlačítko pro spuštění hry */
    #startBtn {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h1>Snake</h1>

  <p id="score">Score: 0</p>

  <button id="startBtn" onclick="startGame()">Start</button>

  <div id="gameBoard"></div>

  <script>
    // Nastavení velikosti mřížky
    let gridSize = 20;
    let gridCount = 20;

    // Připravené základní proměnné pro tvou logiku
    let snake = [];        // Pole, kam si budeš ukládat souřadnice hada [{x:X, y:Y}]
    let foodX = 5;         // Pozice jídla X na mřížce
    let foodY = 5;         // Pozice jídla Y na mřížce
    let score = 0;         // Aktuální skóre
    let timer = null;      // Časovač, který si pak nastavíš pro herní smyčku

    // Odkazy na HTML prvky
    let gameBoard = document.getElementById("gameBoard");
    let scoreText = document.getElementById("score");


    // 1. FUNKCE: Spawnování / generování náhodné pozice pro jablko
    function generateFood() {
      foodX = Math.floor(Math.random() * gridCount);
      foodY = Math.floor(Math.random() * gridCount);
    }


    // 2. FUNKCE: Vytvoření div boxu pro jeden článek hada
    function createSnakePart(x, y) {
      let part = document.createElement("div");
      part.className = "snakePart";
      part.style.left = (x * gridSize) + "px";
      part.style.top = (y * gridSize) + "px";
      return part;
    }


    // 3. FUNKCE: Vytvoření div boxu pro jablko
    function createFoodElement(x, y) {
      let foodDiv = document.createElement("div");
      foodDiv.id = "food";
      foodDiv.style.left = (x * gridSize) + "px";
      foodDiv.style.top = (y * gridSize) + "px";
      return foodDiv;
    }


    // 4. FUNKCE: Kompletní vykreslení aktuálního stavu na plochu
    function draw() {
      // Vymazání starých divů z hrací plochy před novým vykreslením
      gameBoard.innerHTML = ""; 

      // Vykreslení celého hada na hrací plochu procházením tvého pole 'snake'
      for (let i = 0; i < snake.length; i++) {
        let snakePartDiv = createSnakePart(snake[i].x, snake[i].y);
        gameBoard.appendChild(snakePartDiv);
      }

      // Vykreslení jablka na plochu podle aktuálních souřadnic foodX a foodY
      let foodDiv = createFoodElement(foodX, foodY);
      gameBoard.appendChild(foodDiv);
    }


    // Tlačítko Start zavolá tuto funkci – zatím ti jen vyresetuje skóre a vykreslí startovní stav
    function startGame() {
      score = 0;
      scoreText.innerHTML = "Score: " + score;

      // Zde máš ukázkového startovního hada ze 3 článků, abys viděl, že vykreslování funguje
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];

      generateFood(); // Vygeneruje pozici jablka
      draw();         // Zavolá vykreslení na plochu

      // TADY MŮŽEŠ ZAČÍT PSÁT SVŮJ VLASTNÍ KÓD:
      // - Nastavení setInterval pro herní smyčku (pohyb)
      // - Odchytávání stisknutých kláves (ovládání)
    }
  </script>

</body>
</html>
